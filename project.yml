# 这个文件是给「云端打包」用的工程描述。
# 你电脑上没装 Xcode 也没关系：GitHub 上的 Mac 机器会读这个文件，
# 自动生成 Xcode 工程再编译。平时改代码不用动它。

name: CourseTable

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  CourseTable:
    type: application
    platform: iOS
    sources:
      - path: CourseTable
    settings:
      base:
        PRODUCT_NAME: CourseTable
        # 装到手机上时用这个编号。如果签名时报「已被占用」，把它改成任何别的字符串
        PRODUCT_BUNDLE_IDENTIFIER: com.example.coursetable
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: CourseTable/Info.plist
      properties:
        CFBundleDisplayName: 课程表
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 让「文件」App 能看到这个 App 的文件夹，方便把课表文件放进去
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true

schemes:
  CourseTable:
    build:
      targets:
        CourseTable: all
    run:
      config: Debug
    archive:
      config: Release
